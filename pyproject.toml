[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# One name for the repository, the package and the command.
name = "trading-desk"
version = "0.11.0"
description = "An MCP server that keeps your trading record: trades under versioned strategies, checked against their rules, with outcomes and stats"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["trading", "strategy", "trade-journal", "mcp", "claude-code", "replay", "sqlite", "event-sourcing"]
# `mcp` is required: MCP is how an agent reaches the desk (`trading-desk mcp`), served on the
# SDK's low-level server, which passes the agent's arguments through unchanged for the API to
# check. `desk/api.py` is the same face from Python (docs/python.md), and needs nothing else.
# The upper bound is deliberate: 2.x renamed and rewrote its own API within two months, so a
# 3.0 is not taken unseen.
dependencies = ["mcp>=2.3,<3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/IngTian/trading-desk"
Repository = "https://github.com/IngTian/trading-desk"
Issues = "https://github.com/IngTian/trading-desk/issues"

[project.scripts]
trading-desk = "desk.cli:main"

# A dependency group, not an extra: `uv sync` installs groups by default and extras only with
# --extra, so a plain `uv sync`, as CI runs it, has pytest.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]


[tool.setuptools.packages.find]
include = ["desk*"]

# The files the desk reads at run time. CI checks them in a real built wheel: an editable
# install reads the source tree, so it cannot catch a missing entry here.
[tool.setuptools.package-data]
"desk" = ["schema.sql", "strategy.example.md", "instructions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
